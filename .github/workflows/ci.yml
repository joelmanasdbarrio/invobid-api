name: CI

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'feat/**'
      - 'chore/**'
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  unit-tests:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:cov

  e2e-tests:
    name: E2E Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start services
        run: |
          docker compose -f docker/docker-compose.yml up -d --wait db minio
          docker compose -f docker/docker-compose.yml up minio-init

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          NODE_ENV: local
          JWT_SECRET: ci-test-jwt-secret
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: invobid_db
          DB_USR: postgres
          DB_PWD: pass1234
          MINIO_ENDPOINT: localhost
          MINIO_PORT: 9000
          MINIO_USR: minio
          MINIO_PWD: pass1234
          MINIO_ACCESS_KEY: minio
          MINIO_SECRET_KEY: pass1234
          MINIO_BUCKET: invobid
          BUYER_TRANSFER_FEE_PERCENTAGE: 0.2
          SELLER_TRANSFER_FEE_PERCENTAGE: 0.5
          SMALLEST_BID_INCREMENT_PERCENTAGE: 0.1

      - name: Stop services
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v || true

  publish:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests]
    if: startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Determine image tags
        id: tags
        run: |
          IMAGE="ghcr.io/joelmanasdbarrio/invobid-api"
          if [[ "$GITHUB_REF" == refs/heads/release/* ]]; then
            BASE_VERSION="${GITHUB_REF#refs/heads/release/}"
            echo "tags=${IMAGE}:${BASE_VERSION}-rc.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          else
            VERSION="${GITHUB_REF_NAME}"
            echo "tags=${IMAGE}:${VERSION},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}

