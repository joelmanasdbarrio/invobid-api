name: CI

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'feat/**'
      - 'chore/**'
      - 'fix/**'
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  determine-env:
    name: Determine Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
    steps:
      - id: set-env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]] || [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          else
            echo "environment=development" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  unit-tests:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:cov

  e2e-tests:
    name: E2E Tests
    needs: [build, determine-env]
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-env.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start services
        run: |
          docker compose -f docker/docker-compose.yml up -d --wait db minio
          docker compose -f docker/docker-compose.yml up minio-init

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          NODE_ENV: ${{ vars.NODE_ENV }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DB_HOST: ${{ vars.DB_HOST }}
          DB_NAME: ${{ vars.DB_NAME }}
          DB_PORT: ${{ vars.DB_PORT }}
          DB_PWD: ${{ secrets.DB_PWD }}
          DB_USR: ${{ secrets.DB_USR }}
          MINIO_ENDPOINT: ${{ vars.MINIO_ENDPOINT }}
          MINIO_PORT: ${{ vars.MINIO_PORT }}
          MINIO_PWD: ${{ secrets.MINIO_PWD }}
          MINIO_USR: ${{ secrets.MINIO_USR }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          MINIO_BUCKET: ${{ vars.MINIO_BUCKET }}
          BUYER_TRANSFER_FEE_PERCENTAGE: ${{ vars.BUYER_TRANSFER_FEE_PERCENTAGE }}
          SELLER_TRANSFER_FEE_PERCENTAGE: ${{ vars.SELLER_TRANSFER_FEE_PERCENTAGE }}
          SMALLEST_BID_INCREMENT_PERCENTAGE: ${{ vars.SMALLEST_BID_INCREMENT_PERCENTAGE }}
          AUCTION_EXTENSION_MINUTES: ${{ vars.AUCTION_EXTENSION_MINUTES }}

      - name: Stop services
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v || true

  publish:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests, determine-env]
    if: startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/v')
    environment: ${{ needs.determine-env.outputs.environment }}
    outputs:
      image_tags: ${{ steps.tags.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      - name: Determine image tags
        id: tags
        run: |
          IMAGE="ghcr.io/joelmanasdbarrio/invobid-api"
          if [[ "$GITHUB_REF" == refs/heads/release/* ]]; then
            BASE_VERSION="${GITHUB_REF#refs/heads/release/}"
            echo "tags=${IMAGE}:${BASE_VERSION}-rc.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          else
            VERSION="${GITHUB_REF_NAME}"
            echo "tags=${IMAGE}:${VERSION},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [publish, determine-env]
    if: startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/v')
    environment: ${{ needs.determine-env.outputs.environment }}
    steps:
      - name: Extract API tag
        id: extract_tag
        run: |
          TAGS="${{ needs.publish.outputs.image_tags }}"
          echo "TAGS='${TAGS}'"
          if [ -z "${TAGS}" ]; then
            echo "No image tags received from publish job" >&2
            exit 1
          fi
          FIRST_ENTRY="${TAGS%%,*}"
          API_TAG="${FIRST_ENTRY##*:}"
          echo "api_tag=$API_TAG" >> "$GITHUB_OUTPUT"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            cd ~/docker
            export API_TAG='${{ steps.extract_tag.outputs.api_tag }}'
            echo "Using API_TAG=${API_TAG}"
            docker compose -f docker-compose.prod.yml pull api
            docker compose -f docker-compose.prod.yml up -d --no-deps api

      - name: Remove unused Docker images
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: docker image prune -af
